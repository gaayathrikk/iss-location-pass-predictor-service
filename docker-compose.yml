version: "3.9"

services:
  iss-predictor-service:
    build:
      context: ./iss-predictor-service
    container_name: iss-predictor-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POLLUX_LABS_API_KEY: ${POLLUX_LABS_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  iss-predictor-ui:
    build:
      context: ./iss-predictor-ui
    container_name: iss-predictor-ui
    ports:
      - "3000:80"
    depends_on:
      iss-predictor-service:
        condition: service_healthy