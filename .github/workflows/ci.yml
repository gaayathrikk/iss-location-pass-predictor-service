name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iss-predictor-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: iss-predictor-service-jar
          path: iss-predictor-service/target/*.jar

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iss-predictor-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: iss-predictor-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iss-predictor-ui-dist
          path: iss-predictor-ui/dist

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t iss-predictor-service:${{ github.sha }} ./iss-predictor-service

      - name: Build frontend image
        run: docker build -t iss-predictor-ui:${{ github.sha }} ./iss-predictor-ui

      # To push to a registry: add a docker/login-action step here using repository
      # secrets (e.g. DOCKERHUB_USERNAME/DOCKERHUB_TOKEN), then `docker push` both
      # images. Omitted since no registry was specified for this assignment.