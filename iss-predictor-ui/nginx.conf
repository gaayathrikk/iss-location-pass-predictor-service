server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container. "iss-predictor-service" resolves
    # via Docker Compose's internal DNS - it's the service name from docker-compose.yml,
    # not a real hostname.
    location /api/ {
        proxy_pass http://iss-predictor-service:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any route not matching a static file goes to index.html,
    # so client-side routing doesn't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}